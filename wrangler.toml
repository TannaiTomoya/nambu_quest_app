# Cloudflare Pages + D1（ステージング/本番）
# 静的配信: prototype/
# Functions: functions/（/events, /go/:destinationId）

name = "nambu-quest"
compatibility_date = "2025-07-01"
pages_build_output_dir = "prototype"

[[d1_databases]]
binding = "DB"
database_name = "nambu-quest-events"
# d1 create 後に発行される ID を記入する
database_id = "REPLACE_AFTER_D1_CREATE"
