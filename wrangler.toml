# Cloudflare Pages + D1（ステージング/本番）
# 静的配信: prototype/
# Functions: functions/（/events, /go/:destinationId）

name = "nambu-quest"
compatibility_date = "2025-07-01"
pages_build_output_dir = "prototype"

[[d1_databases]]
binding = "DB"
database_name = "nambu-quest-events"
# リモート作成後に実IDへ差し替える。ローカル(--local)検証はこの仮IDで可
database_id = "00000000-0000-0000-0000-000000000001"
